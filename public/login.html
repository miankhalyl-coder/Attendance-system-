<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0755C9">
  <title>Login — GPS Kotli Ghasi Attendance Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/login.js"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="school-icon"><i class="bi bi-mortarboard-fill"></i></div>
        <h1 class="h3 fw-bold mb-0">GPS Kotli Ghasi</h1>
        <div class="text-muted">Attendance Management System</div>
      </div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
            <input id="username" name="username" class="form-control form-control-lg" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
            <input id="password" name="password" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
            <button class="btn btn-outline-secondary btn-touch" type="button" id="togglePw" aria-label="Show or hide password"><i class="bi bi-eye"></i></button></div>
        </div>
        <div id="err" class="alert alert-danger d-none py-2" role="alert"></div>
        <button id="submit" type="submit" class="btn btn-primary btn-lg w-100">Login</button>
      </form>
    </div>
  </div>
</body>
</html>
