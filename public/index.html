<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPS Kotli Ghasi — Attendance Management System</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <noscript><meta http-equiv="refresh" content="0; url=login.html"></noscript>
  <script type="module">
    import { supabase } from "./assets/js/supabase.js";
    import { fetchProfile, homeFor } from "./assets/js/auth.js";
    try {
      const { data: { session } } = await supabase.auth.getSession();
      const p = session ? await fetchProfile(session.user.id) : null;
      location.replace(p?.is_active ? homeFor(p.role) : "login.html");
    } catch { location.replace("login.html"); }
  </script>
</head>
<body><p style="padding:2rem;text-align:center">Loading…</p></body>
</html>
